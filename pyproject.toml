[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-personality-lab"
version = "1.0.0"
description = "Reproducible synthetic work-style classification experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
personality-lab = "candidate_personality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
